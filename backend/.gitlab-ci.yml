image: node:latest

stages:
  - build
  - test

cache:
  paths:
    - node_modules/

build:
  stage: build
  tags:
    - main-runner
  script:
    - echo "Building the application..."
    - npm install
    - npm run build
  only:
    - main
    - merge_requests

test:
  stage: test
  tags:
    - main-runner
  script:
    - echo "Running tests..."
    - npm install
    - npm run test
  only:
    - main
    - merge_requests
